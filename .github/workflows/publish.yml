name: Publish
on:
  release:
    types:
      - published
jobs:
  publish:
    if: github.repository_owner == 'FlashyReese'
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: 25
          check-latest: true
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
          cache-provider: basic
      - name: Upload assets to releases
        run: ./gradlew build publishAllPublicationsToFlashyReeseReleasesRepository -Pbuild.release
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      - name: Publish NeoForge to Modrinth, CurseForge & GitHub
        uses: Kira-NT/mc-publish@c23376546a97f5ba7984e94445da359459b14419 # v3.3.2
        with:
          modrinth-id: PtjYWJkn
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 447673
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: '[NeoForge] ${{ github.event.release.name }}'
          version: '${{ github.event.release.tag_name }}+neoforge'
          environment: client
          loaders: neoforge
          dependencies: |
            sodium
            greenlight(optional)
            reeses-sodium-options(optional)
            irisshaders(optional)
            iris(optional)
          files: |
            neoforge/build/libs/!(*-@(dev|sources|javadoc|dev-shadow)).jar
            neoforge/build/libs/*-@(dev|sources|javadoc|dev-shadow).jar
      - name: Publish Fabric to Modrinth, CurseForge & GitHub
        uses: Kira-NT/mc-publish@c23376546a97f5ba7984e94445da359459b14419 # v3.3.2
        with:
          modrinth-id: PtjYWJkn
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 447673
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: '[Fabric] ${{ github.event.release.name }}'
          version: '${{ github.event.release.tag_name }}+fabric'
          environment: client
          loaders: fabric
          dependencies: |
            sodium
            greenlight(optional)
            reeses-sodium-options(optional)
            irisshaders(optional)
            iris(optional)
          files: |
            fabric/build/libs/!(*-@(dev|sources|javadoc|dev-shadow)).jar
            fabric/build/libs/*-@(dev|sources|javadoc|dev-shadow).jar
